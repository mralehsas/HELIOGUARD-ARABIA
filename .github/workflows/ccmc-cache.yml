name: HELIOGUARD CCMC Gateway Cache

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */2 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/ccmc-cache.yml'
      - '.github/scripts/refresh_ccmc_cache.py'

permissions:
  contents: write

concurrency:
  group: helioguard-ccmc-gateway-cache
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch and validate NASA CCMC Scoreboard
        shell: bash
        run: |
          python .github/scripts/refresh_ccmc_cache.py

      - name: Commit refreshed gateway data
        shell: bash
        run: |
          git config user.name 'HELIOGUARD CCMC Gateway'
          git config user.email 'actions@users.noreply.github.com'
          git add data/ccmc-scoreboard-recent.json data/ccmc-scoreboard-90d.json
          if git diff --cached --quiet; then
            echo 'No cache change.'
            exit 0
          fi
          git commit -m 'Refresh NASA CCMC gateway cache'
          git pull --rebase origin main
          git push origin main
