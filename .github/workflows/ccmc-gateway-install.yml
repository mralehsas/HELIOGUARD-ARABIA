name: Install HELIOGUARD CCMC Gateway

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ccmc-gateway-install.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Diagnose NASA CCMC server-to-server reachability
        shell: bash
        run: |
          python .github/scripts/refresh_ccmc_cache.py

      - name: RED - resilient CCMC contract
        id: red
        continue-on-error: true
        shell: bash
        run: |
          python .github/scripts/install_ccmc_gateway.py test

      - name: Confirm intended RED
        if: steps.red.outcome != 'failure'
        shell: bash
        run: |
          echo 'RED test did not fail for the missing frontend gateway.'
          exit 1

      - name: Apply frontend gateway patch
        shell: bash
        run: |
          python .github/scripts/install_ccmc_gateway.py apply

      - name: GREEN - verify gateway and static assets
        shell: bash
        run: |
          python .github/scripts/install_ccmc_gateway.py test
          python -m py_compile .github/scripts/refresh_ccmc_cache.py .github/scripts/install_ccmc_gateway.py
          git diff --check

      - name: Commit installation
        shell: bash
        run: |
          git config user.name 'HELIOGUARD Gateway Installer'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html data/ccmc-scoreboard-recent.json data/ccmc-scoreboard-90d.json
          git commit -m 'Add resilient NASA CCMC gateway fallback'
          git pull --rebase origin main
          git push origin main
