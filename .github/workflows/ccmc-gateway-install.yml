name: Install HELIOGUARD CCMC Gateway

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ccmc-gateway-install.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Diagnose CCMC server boundary
        shell: bash
        run: |
          set -e
          URL='https://kauai.ccmc.gsfc.nasa.gov/CMEscoreboard/WS/get/predictions'
          echo '=== CCMC response headers (browser CORS evidence) ==='
          curl -sSIL --max-time 30 "$URL" | sed -n '1,35p' || true
          echo '=== Server-to-server JSON reachability ==='
          python - <<'PY'
          import json, urllib.request
          u='https://kauai.ccmc.gsfc.nasa.gov/CMEscoreboard/WS/get/predictions?CMEtimeStart=2026-08-01&CMEtimeEnd=2026-09-02&skipNoArrivalObservedCMEs=false&closeOutCMEsOnly=false'
          req=urllib.request.Request(u,headers={'User-Agent':'HELIOGUARD-ARABIA/1.0 (+GitHub Actions gateway diagnostics)','Accept':'application/json'})
          with urllib.request.urlopen(req,timeout=45) as r:
              data=json.load(r)
              print('HTTP',r.status,'events',len(data) if isinstance(data,list) else type(data).__name__)
              assert isinstance(data,list)
          PY

      - name: RED - resilient gateway contract
        id: red
        continue-on-error: true
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          required=[
            'fetchScoreboardResilient',
            'scoreboardGatewayRecent',
            'scoreboardGateway90',
            'HELIOGUARD CCMC Gateway',
          ]
          missing=[x for x in required if x not in s]
          files=[Path('data/ccmc-scoreboard-recent.json'),Path('data/ccmc-scoreboard-90d.json'),Path('.github/workflows/ccmc-cache.yml')]
          if missing or any(not p.exists() for p in files):
              print('Expected RED: resilient CCMC gateway not installed yet.')
              print('Missing markers:',missing)
              print('Missing files:',[str(p) for p in files if not p.exists()])
              raise SystemExit(1)
          raise SystemExit('RED unexpectedly passed; refusing duplicate install.')
          PY

      - name: Confirm intended RED
        if: steps.red.outcome != 'failure'
        run: |
          echo 'RED test did not fail for the missing feature.'
          exit 1

      - name: Build initial server-fed CCMC cache
        shell: bash
        run: |
          mkdir -p data
          python - <<'PY'
          import json, urllib.parse, urllib.request
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          BASE='https://kauai.ccmc.gsfc.nasa.gov/CMEscoreboard/WS/get/predictions'
          now=datetime.now(timezone.utc)

          def fetch(days, closed_only, skip_no_arrival, out):
              start=(now-timedelta(days=days)).date().isoformat()
              end=now.date().isoformat()
              q=urllib.parse.urlencode({
                  'CMEtimeStart':start,
                  'CMEtimeEnd':end,
                  'skipNoArrivalObservedCMEs':str(skip_no_arrival).lower(),
                  'closeOutCMEsOnly':str(closed_only).lower(),
              })
              url=BASE+'?'+q
              req=urllib.request.Request(url,headers={
                  'User-Agent':'HELIOGUARD-ARABIA/1.0 (+GitHub Actions CCMC gateway)',
                  'Accept':'application/json'
              })
              with urllib.request.urlopen(req,timeout=60) as r:
                  events=json.load(r)
                  if not isinstance(events,list):
                      raise RuntimeError(f'Unexpected CCMC payload: {type(events).__name__}')
              payload={
                  'schema':'HELIOGUARD_CCMC_GATEWAY_V1',
                  'fetchedAt':now.isoformat().replace('+00:00','Z'),
                  'source':BASE,
                  'query':{'CMEtimeStart':start,'CMEtimeEnd':end,'skipNoArrivalObservedCMEs':skip_no_arrival,'closeOutCMEsOnly':closed_only},
                  'events':events,
              }
              Path(out).write_text(json.dumps(payload,ensure_ascii=False,separators=(',',':')),encoding='utf-8')
              print(out,'events=',len(events))

          fetch(45,False,False,'data/ccmc-scoreboard-recent.json')
          fetch(90,True,False,'data/ccmc-scoreboard-90d.json')
          PY

      - name: Add persistent cache updater
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          Path('.github/workflows/ccmc-cache.yml').write_text(r'''name: HELIOGUARD CCMC Gateway Cache

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */2 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/ccmc-cache.yml'

permissions:
  contents: write

concurrency:
  group: helioguard-ccmc-gateway-cache
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch NASA CCMC Scoreboard server-side
        shell: bash
        run: |
          mkdir -p data
          python - <<'PY2'
          import json, urllib.parse, urllib.request
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          BASE='https://kauai.ccmc.gsfc.nasa.gov/CMEscoreboard/WS/get/predictions'
          now=datetime.now(timezone.utc)

          def fetch(days, closed_only, skip_no_arrival, out):
              start=(now-timedelta(days=days)).date().isoformat()
              end=now.date().isoformat()
              q=urllib.parse.urlencode({
                  'CMEtimeStart':start,
                  'CMEtimeEnd':end,
                  'skipNoArrivalObservedCMEs':str(skip_no_arrival).lower(),
                  'closeOutCMEsOnly':str(closed_only).lower(),
              })
              url=BASE+'?'+q
              req=urllib.request.Request(url,headers={'User-Agent':'HELIOGUARD-ARABIA/1.0 (+GitHub Actions CCMC gateway)','Accept':'application/json'})
              with urllib.request.urlopen(req,timeout=60) as r:
                  events=json.load(r)
                  if not isinstance(events,list):
                      raise RuntimeError(f'Unexpected CCMC payload: {type(events).__name__}')
              payload={'schema':'HELIOGUARD_CCMC_GATEWAY_V1','fetchedAt':now.isoformat().replace('+00:00','Z'),'source':BASE,'query':{'CMEtimeStart':start,'CMEtimeEnd':end,'skipNoArrivalObservedCMEs':skip_no_arrival,'closeOutCMEsOnly':closed_only},'events':events}
              Path(out).write_text(json.dumps(payload,ensure_ascii=False,separators=(',',':')),encoding='utf-8')
              print(out,'events=',len(events))

          fetch(45,False,False,'data/ccmc-scoreboard-recent.json')
          fetch(90,True,False,'data/ccmc-scoreboard-90d.json')
          PY2
      - name: Validate cache payloads
        shell: bash
        run: |
          python - <<'PY2'
          import json
          from pathlib import Path
          for f in ['data/ccmc-scoreboard-recent.json','data/ccmc-scoreboard-90d.json']:
              p=json.loads(Path(f).read_text(encoding='utf-8'))
              assert p.get('schema')=='HELIOGUARD_CCMC_GATEWAY_V1'
              assert isinstance(p.get('events'),list)
              assert p.get('fetchedAt') and p.get('source','').startswith('https://kauai.ccmc.gsfc.nasa.gov/')
              print(f,'OK',len(p['events']))
          PY2
      - name: Commit refreshed gateway data
        shell: bash
        run: |
          git config user.name 'HELIOGUARD CCMC Gateway'
          git config user.email 'actions@users.noreply.github.com'
          git add data/ccmc-scoreboard-recent.json data/ccmc-scoreboard-90d.json
          if git diff --cached --quiet; then
            echo 'No cache change.'
            exit 0
          fi
          git commit -m 'Refresh NASA CCMC gateway cache'
          git pull --rebase origin main
          git push origin main
''',encoding='utf-8')
          PY

      - name: Patch frontend for direct plus gateway fallback
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          old='    scoreboard: "https://kauai.ccmc.gsfc.nasa.gov/CMEscoreboard/WS/get/predictions",'
          new='    scoreboard: "https://kauai.ccmc.gsfc.nasa.gov/CMEscoreboard/WS/get/predictions",\n    scoreboardGatewayRecent: "data/ccmc-scoreboard-recent.json",\n    scoreboardGateway90: "data/ccmc-scoreboard-90d.json",'
          if s.count(old)!=1:
              raise SystemExit(f'Unsafe CONFIG patch count: {s.count(old)}')
          s=s.replace(old,new,1)

          old_ccmc='    {id:"ccmc",agency:"NASA CCMC",name:"CME Scoreboard",role:"توقعات وصول CME متعددة النماذج والتحقق التاريخي.",fresh:null,endpoints:[{label:"Predictions",url:scoreboardUrl({CMEtimeStart:r30.start,CMEtimeEnd:r30.end,skipNoArrivalObservedCMEs:false,closeOutCMEsOnly:false}),kind:"json",timeout:30000}],time:d=>null,count:d=>Array.isArray(d)?d.length:(Array.isArray(d?.events)?d.events.length:0),valid:d=>Array.isArray(d)||Array.isArray(d?.events)||typeof d==="object"},'
          new_ccmc='    {id:"ccmc",agency:"NASA CCMC",name:"CME Scoreboard",role:"توقعات وصول CME متعددة النماذج والتحقق التاريخي.",fresh:180,endpoints:[{label:"HELIOGUARD CCMC Gateway",url:`${CONFIG.endpoints.scoreboardGatewayRecent}?v=${Date.now()}`,kind:"json",timeout:12000},{label:"NASA CCMC Direct",url:scoreboardUrl({CMEtimeStart:r30.start,CMEtimeEnd:r30.end,skipNoArrivalObservedCMEs:false,closeOutCMEsOnly:false}),kind:"json",timeout:30000}],time:d=>d?.fetchedAt||null,count:d=>Array.isArray(d)?d.length:(Array.isArray(d?.events)?d.events.length:0),valid:d=>Array.isArray(d)||Array.isArray(d?.events)||typeof d==="object"},'
          if s.count(old_ccmc)!=1:
              raise SystemExit(f'Unsafe CCMC service patch count: {s.count(old_ccmc)}')
          s=s.replace(old_ccmc,new_ccmc,1)

          anchor='function scoreboardUrl(params){const u=new URL(CONFIG.endpoints.scoreboard);Object.entries(params).forEach(([k,v])=>v!==null&&v!==undefined&&v!==""&&u.searchParams.set(k,String(v)));return u.toString()}'
          if s.count(anchor)!=1:
              raise SystemExit(f'Unsafe helper anchor count: {s.count(anchor)}')
          helper=r'''
function filterGatewayScoreboard(events,params={}){
  let out=Array.isArray(events)?events.slice():[];
  if(params.CMEID)out=out.filter(e=>String(e?.cmeID||"")===String(params.CMEID));
  if(params.CMEtimeStart&&params.CMEtimeEnd){const a=Date.parse(params.CMEtimeStart+"T00:00:00Z"),b=Date.parse(params.CMEtimeEnd+"T23:59:59Z");out=out.filter(e=>{const t=Date.parse(e?.observedTime||"");return Number.isFinite(t)&&t>=a&&t<=b})}
  if(params.skipNoArrivalObservedCMEs===true||String(params.skipNoArrivalObservedCMEs)==="true")out=out.filter(e=>e?.noArrivalObserved!==true);
  if(params.closeOutCMEsOnly===true||String(params.closeOutCMEsOnly)==="true")out=out.filter(e=>Boolean(e?.arrivalTime)||e?.noArrivalObserved===true);
  return out
}
async function fetchScoreboardGatewayFile(url,params,timeout){const raw=await fetchJson(`${url}?v=${Date.now()}`,timeout);const events=normalizeScoreboardPayload(raw);return {raw,events:filterGatewayScoreboard(events,params)}}
async function fetchScoreboardResilient(params={},timeout=25000){
  let directError=null;
  try{const raw=await fetchJson(scoreboardUrl(params),timeout);state.forecast.scoreboardProvider="direct";return raw}catch(err){directError=err;console.warn("CCMC direct blocked/unavailable; trying HELIOGUARD gateway:",err)}
  const validation=Boolean(params?.CMEtimeStart&&params?.CMEtimeEnd&&(params?.closeOutCMEsOnly===true||String(params?.closeOutCMEsOnly)==="true"));
  const first=validation?CONFIG.endpoints.scoreboardGateway90:CONFIG.endpoints.scoreboardGatewayRecent;
  const second=validation?CONFIG.endpoints.scoreboardGatewayRecent:CONFIG.endpoints.scoreboardGateway90;
  try{
    let r=await fetchScoreboardGatewayFile(first,params,12000);
    if(params.CMEID&&!r.events.length)r=await fetchScoreboardGatewayFile(second,params,12000);
    if(params.CMEID&&!r.events.length)throw directError||new Error("CME not present in gateway cache");
    state.forecast.scoreboardProvider="gateway";
    return r.events
  }catch(gatewayError){console.warn("HELIOGUARD CCMC gateway unavailable:",gatewayError);throw directError||gatewayError}
}
function markScoreboardProviderStatus(){const el=$("statusScoreboard");if(!el||!state.liveStarted)return;if(state.forecast.scoreboardProvider==="gateway"){el.textContent=hgT("متصل — بوابة GitHub","Connected — GitHub Gateway");el.style.color="var(--green)"}else if(state.forecast.scoreboardProvider==="direct"){el.textContent=hgT("متصل مباشر","Directly Connected");el.style.color="var(--green)"}}
'''
          s=s.replace(anchor,anchor+helper,1)

          old1='fetchJson(scoreboardUrl({CMEID:id,skipNoArrivalObservedCMEs:false,closeOutCMEsOnly:false}),25000)'
          new1='fetchScoreboardResilient({CMEID:id,skipNoArrivalObservedCMEs:false,closeOutCMEsOnly:false},25000)'
          if s.count(old1)!=1: raise SystemExit(f'Unsafe forecast call patch count: {s.count(old1)}')
          s=s.replace(old1,new1,1)

          old2='fetchJson(scoreboardUrl({CMEtimeStart:start,CMEtimeEnd:end,skipNoArrivalObservedCMEs:true,closeOutCMEsOnly:true}),30000)'
          new2='fetchScoreboardResilient({CMEtimeStart:start,CMEtimeEnd:end,skipNoArrivalObservedCMEs:true,closeOutCMEsOnly:true},30000)'
          if s.count(old2)!=1: raise SystemExit(f'Unsafe validation call patch count: {s.count(old2)}')
          s=s.replace(old2,new2,1)

          s=s.replace('setServerStatus("scoreboard",true);$("forecastDot")','setServerStatus("scoreboard",true);markScoreboardProviderStatus();$("forecastDot")',1)
          s=s.replace('setServerStatus("scoreboard",true)}catch(err){console.error("Validation:', 'setServerStatus("scoreboard",true);markScoreboardProviderStatus()}catch(err){console.error("Validation:',1)

          p.write_text(s,encoding='utf-8')
          PY

      - name: GREEN - verify resilient CCMC gateway
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          for marker in ['fetchScoreboardResilient','scoreboardGatewayRecent','scoreboardGateway90','HELIOGUARD CCMC Gateway','Connected — GitHub Gateway']:
              assert marker in s, marker
          assert 'fetchJson(scoreboardUrl({CMEID:id,skipNoArrivalObservedCMEs:false,closeOutCMEsOnly:false}),25000)' not in s
          assert 'fetchJson(scoreboardUrl({CMEtimeStart:start,CMEtimeEnd:end,skipNoArrivalObservedCMEs:true,closeOutCMEsOnly:true}),30000)' not in s
          for f in ['data/ccmc-scoreboard-recent.json','data/ccmc-scoreboard-90d.json']:
              d=json.loads(Path(f).read_text(encoding='utf-8'))
              assert d['schema']=='HELIOGUARD_CCMC_GATEWAY_V1'
              assert isinstance(d['events'],list)
              assert d['source'].startswith('https://kauai.ccmc.gsfc.nasa.gov/')
              print(f,'events=',len(d['events']))
          w=Path('.github/workflows/ccmc-cache.yml').read_text(encoding='utf-8')
          assert "cron: '17 */2 * * *'" in w
          assert 'CMEscoreboard/WS/get/predictions' in w
          print('GREEN: direct CCMC + same-origin gateway fallback installed and cache validated.')
          PY
          git diff --check

      - name: Commit installation
        shell: bash
        run: |
          git config user.name 'HELIOGUARD Gateway Installer'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html data/ccmc-scoreboard-recent.json data/ccmc-scoreboard-90d.json .github/workflows/ccmc-cache.yml
          git commit -m 'Add resilient NASA CCMC gateway fallback'
          git push origin main
