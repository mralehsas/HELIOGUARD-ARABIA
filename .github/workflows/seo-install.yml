name: Install HELIOGUARD SEO

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/seo-install.yml'
      - '.github/scripts/install_seo.py'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: RED - SEO contract must fail before install
        id: red
        continue-on-error: true
        run: python .github/scripts/install_seo.py test

      - name: Verify expected RED
        if: steps.red.outcome != 'failure'
        run: |
          echo 'SEO RED test unexpectedly passed; refusing unsafe duplicate installation.'
          exit 1

      - name: Apply SEO metadata and discovery files
        run: python .github/scripts/install_seo.py apply

      - name: GREEN - verify SEO contract
        run: |
          python .github/scripts/install_seo.py test
          python -m py_compile .github/scripts/install_seo.py
          git diff --check

      - name: Commit SEO installation
        run: |
          git config user.name 'HELIOGUARD SEO Installer'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html robots.txt sitemap.xml
          git commit -m 'Optimize HELIOGUARD for search indexing'
          git pull --rebase origin main
          git push origin main
