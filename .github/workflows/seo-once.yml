name: Inspect About Dialog

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/seo-once.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect About-related snippets
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8')
          needles = ['حول البرنامج','حول','about','About','modal','openAbout','showAbout']
          for needle in needles:
              print('\n===== NEEDLE:', needle, '=====')
              start = 0
              count = 0
              while True:
                  i = s.find(needle, start)
                  if i < 0: break
                  count += 1
                  a = max(0, i-1200); b = min(len(s), i+2400)
                  print(f'--- occurrence {count} at {i} ---')
                  print(s[a:b])
                  start = i + len(needle)
                  if count >= 12: break
              print('COUNT', count)
          PY
