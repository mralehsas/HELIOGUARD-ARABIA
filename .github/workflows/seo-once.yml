        shell: bash
        run: |
          git config user.name "HELIOGUARD Documentation Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html docs/HELIOGUARD_ARABIA_Scientific_Guide_AR_EN.html docs/HELIOGUARD_ARABIA_Scientific_Guide_AR_EN.pdf
          git commit -m "Add full HELIOGUARD scientific guide and About PDF link"
