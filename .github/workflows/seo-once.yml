name: Add HELIOGUARD Scientific Guide

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/seo-once.yml'

permissions:
  contents: write

jobs:
  guide:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: RED - guide contract is not yet satisfied
        id: red
        continue-on-error: true
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8')
          required = [
              'docs/HELIOGUARD_ARABIA_Scientific_Guide_AR_EN.pdf',
              'الدليل العلمي والتشغيلي الكامل',
              'Complete Scientific & Operational Guide',
          ]
          missing = [x for x in required if x not in s]
          pdf = Path('docs/HELIOGUARD_ARABIA_Scientific_Guide_AR_EN.pdf')
          if missing or not pdf.exists():
              print('Expected RED: guide/link requirements are absent before implementation.')
              print('Missing markers:', missing)
              print('PDF exists:', pdf.exists())
              raise SystemExit(1)
          raise SystemExit('RED test unexpectedly passed; refusing duplicate implementation.')
          PY

      - name: Confirm RED failed for the intended reason
        if: steps.red.outcome != 'failure'
        run: |
          echo 'RED test did not fail as expected.'
          exit 1

      - name: Create full bilingual scientific guide source
        shell: bash
        run: |
          mkdir -p docs
          cat > docs/HELIOGUARD_ARABIA_Scientific_Guide_AR_EN.html <<'HTML'
          <!doctype html>
          <html lang="ar" dir="rtl">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>HELIOGUARD ARABIA - الدليل العلمي والتشغيلي الكامل</title>
          <style>
          @page{size:A4;margin:14mm 14mm 16mm}
          *{box-sizing:border-box} body{font-family:"Noto Naskh Arabic","Noto Sans Arabic",Arial,sans-serif;color:#142432;line-height:1.58;margin:0;background:#fff;font-size:10.7pt}
          .cover{min-height:260mm;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;page-break-after:always}
          .logo{width:92px;height:92px;margin-bottom:16px}.brand{font-family:Arial,sans-serif;font-size:30pt;font-weight:800;color:#0b5f8a;letter-spacing:.6px}.arabic-title{font-size:26pt;font-weight:800;margin:8px 0;color:#0a1724}.subtitle{font-size:15pt;color:#0c8fbf;font-weight:700}.credit{margin-top:32px;border-top:1px solid #cbdbe4;padding-top:16px;width:80%;font-size:11pt}.url{direction:ltr;color:#0c8fbf;font-family:Arial,sans-serif;margin-top:15px}
