name: Refine HELIOGUARD Google Appearance

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  refine:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: RED - confirm old search metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          assert '<title>الدرع الشمسي العربي | HELIOGUARD ARABIA — مراقبة الطقس الفضائي</title>' in s
          assert '"@type":"WebApplication"' in s
          assert '"@graph"' not in s
          print('RED baseline confirmed: old metadata is present.')
          PY

      - name: Apply concise Google metadata and structured data
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, json
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          title='الدرع الشمسي العربي | HELIOGUARD ARABIA'
          desc='الدرع الشمسي العربي HELIOGUARD ARABIA منصة عربية لمراقبة الطقس الفضائي والنشاط الشمسي لحظيًا، وعرض الرياح الشمسية وKp وBz والتنبيهات اعتمادًا على بيانات من NASA وNOAA.'
          url='https://mralehsas.github.io/HELIOGUARD-ARABIA/'
          s=re.sub(r'<title>.*?</title>', f'<title>{title}</title>', s, count=1, flags=re.S)
          s=re.sub(r'<meta name="description" content="[^"]*"\s*/>', f'<meta name="description" content="{desc}" />', s, count=1)
          s=re.sub(r'<meta property="og:title" content="[^"]*"\s*/>', f'<meta property="og:title" content="{title}" />', s, count=1)
          s=re.sub(r'<meta property="og:description" content="[^"]*"\s*/>', f'<meta property="og:description" content="{desc}" />', s, count=1)
          s=re.sub(r'<meta name="twitter:title" content="[^"]*"\s*/>', f'<meta name="twitter:title" content="{title}" />', s, count=1)
          s=re.sub(r'<meta name="twitter:description" content="[^"]*"\s*/>', f'<meta name="twitter:description" content="{desc}" />', s, count=1)
          graph={
            '@context':'https://schema.org',
            '@graph':[
              {
                '@type':'WebSite','@id':url+'#website','url':url,
                'name':'الدرع الشمسي العربي | HELIOGUARD ARABIA',
                'alternateName':['HELIOGUARD ARABIA','الدرع الشمسي العربي'],
                'description':desc,'inLanguage':['ar','en']
              },
              {
                '@type':'WebApplication','@id':url+'#app','url':url,
                'name':'الدرع الشمسي العربي — HELIOGUARD ARABIA',
                'alternateName':'HELIOGUARD ARABIA','description':desc,
                'applicationCategory':'ScienceApplication','operatingSystem':'Web',
                'browserRequirements':'Requires JavaScript and a modern web browser',
                'inLanguage':['ar','en'],'isAccessibleForFree':True,
                'author':{'@type':'Person','name':'الفيزيائي عمر الباز'},
                'creator':{'@type':'Person','name':'الفيزيائي عمر الباز'},
                'offers':{'@type':'Offer','price':'0','priceCurrency':'USD'},
                'isPartOf':{'@id':url+'#website'}
              }
            ]
          }
          js=json.dumps(graph, ensure_ascii=False, separators=(',',':'))
          s=re.sub(r'<script type="application/ld\+json">.*?</script>', f'<script type="application/ld+json">{js}</script>', s, count=1, flags=re.S)
          p.write_text(s,encoding='utf-8')
          PY

      - name: GREEN - verify Google appearance contract
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          checks=[
            '<title>الدرع الشمسي العربي | HELIOGUARD ARABIA</title>',
            'name="google-site-verification" content="Q1WXwE14uj-SmZwY_HMEIXT-RHMrkdeew_KEvrlMI38"',
            '<link rel="canonical" href="https://mralehsas.github.io/HELIOGUARD-ARABIA/" />',
            '"@graph"', '"@type":"WebSite"', '"@type":"WebApplication"',
            'اعتمادًا على بيانات من NASA وNOAA'
          ]
          missing=[x for x in checks if x not in s]
          assert not missing, missing
          assert s.count('google-site-verification') == 1
          assert s.count('application/ld+json') == 1
          print('GREEN: search metadata contract passed.')
          PY

      - name: Commit refined metadata
        run: |
          git config user.name "HELIOGUARD SEO"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Refine HELIOGUARD Google search appearance"
          git push
